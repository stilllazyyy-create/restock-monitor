name: Chrome Hearts Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Chrome Hearts
        env:
          CHROME_HEARTS_WEBHOOK_URL: ${{ secrets.CHROME_HEARTS_WEBHOOK_URL }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.request
          from urllib.parse import urljoin, urlparse

          BASE_URL = "https://www.chromehearts.com/"
          STATE_FILE = ".chromehearts_state.json"

          webhook = os.environ["CHROME_HEARTS_WEBHOOK_URL"]

          # ------------------------
          # BASIC FUNCTIONS
          # ------------------------

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept-Language": "en-US,en;q=0.9"
                  }
              )

              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode(
                      "utf-8",
                      errors="ignore"
                  )


          def send_discord(text):
              data = json.dumps({
                  "content": text
              }).encode()

              req = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0"
                  },
                  method="POST"
              )

              urllib.request.urlopen(
                  req,
                  timeout=20
              )


          def normalize_path(url):
              parsed = urlparse(url)
              path = parsed.path.rstrip("/")
              return path or "/"


          # ------------------------
          # LOAD OLD STATE
          # ------------------------

          try:
              with open(STATE_FILE, "r") as f:
                  state = json.load(f)
          except (
              FileNotFoundError,
              json.JSONDecodeError
          ):
              state = {}

          known_categories = set(
              state.get(
                  "known_categories",
                  []
              )
          )

          previous_online = set(
              state.get(
                  "online_categories",
                  []
              )
          )

          # Compatibility with old version
          previous_products = state.get(
              "current_products_by_category",
              state.get(
                  "products_by_category",
                  {}
              )
          )

          ever_seen_products = state.get(
              "ever_seen_products_by_category",
              state.get(
                  "products_by_category",
                  {}
              )
          )

          initialized = state.get(
              "initialized",
              bool(known_categories)
          )

          # ------------------------
          # FIND CURRENT CATEGORIES
          # ------------------------

          homepage = fetch(BASE_URL)

          links = re.findall(
              r'href=["\']([^"\']+)["\']',
              homepage,
              flags=re.I
          )

          ignore_paths = {
              "/",
              "/cart",
              "/bag",
              "/login",
              "/account",
              "/search",
              "/checkout",
              "/contact",
              "/locations.html",
              "/privacy.html",
              "/retailers.html",
              "/terms.html",
              "/magazine"
          }

          current_categories = set()

          for href in links:
              absolute = urljoin(
                  BASE_URL,
                  href
              )

              if "chromehearts.com" not in absolute:
                  continue

              path = normalize_path(
                  absolute
              )

              if path in ignore_paths:
                  continue

              # Products normally end in .html
              if path.endswith(".html"):
                  continue

              lower_path = path.lower()

              if any(
                  bad in lower_path
                  for bad in [
                      "wishlist",
                      "customer-service",
                      "checkout",
                      "search",
                      "account",
                      "cart",
                      "login"
                  ]
              ):
                  continue

              # Only root shop categories
              if path.count("/") == 1:
                  current_categories.add(
                      path
                  )

          print(
              "Current categories:",
              sorted(current_categories)
          )

          # ------------------------
          # CATEGORY ALERTS
          # ------------------------

          brand_new_categories = (
              current_categories
              - known_categories
          )

          back_online_categories = (
              current_categories
              & known_categories
              - previous_online
          )

          if not initialized:
              print(
                  f"Chrome Hearts category baseline: "
                  f"{len(current_categories)} categories"
              )

          else:
              for category in sorted(
                  brand_new_categories
              ):
                  name = category.lstrip("/")

                  send_discord(
                      "🔥 **CHROME HEARTS 新分类上线**\n"
                      f"分类：**{name}**\n"
                      f"{urljoin(BASE_URL, category)}"
                  )

                  print(
                      f"NEW CATEGORY: {name}"
                  )

              for category in sorted(
                  back_online_categories
              ):
                  name = category.lstrip("/")

                  send_discord(
                      "🔄 **CHROME HEARTS 分类重新上线**\n"
                      f"分类：**{name}**\n"
                      f"{urljoin(BASE_URL, category)}"
                  )

                  print(
                      f"CATEGORY BACK ONLINE: {name}"
                  )

          # ------------------------
          # CHECK PRODUCTS
          # ------------------------

          current_products_state = {}

          # Keep history for categories that may disappear
          new_ever_seen_state = {
              key: list(value)
              for key, value
              in ever_seen_products.items()
          }

          for category in sorted(
              current_categories
          ):
              category_name = (
                  category.lstrip("/")
              )

              category_url = urljoin(
                  BASE_URL,
                  category
              )

              try:
                  html = fetch(
                      category_url
                  )

              except Exception as e:
                  print(
                      f"ERROR fetching "
                      f"{category_name}: {e}"
                  )
                  continue

              hrefs = re.findall(
                  r'href=["\']'
                  r'([^"\']+\.html'
                  r'(?:\?[^"\']*)?)'
                  r'["\']',
                  html,
                  flags=re.I
              )

              current_products = set()

              for href in hrefs:
                  absolute = urljoin(
                      category_url,
                      href
                  )

                  if (
                      "chromehearts.com"
                      not in absolute
                  ):
                      continue

                  product_path = (
                      normalize_path(
                          absolute
                      )
                  )

                  # Product must belong
                  # to this category
                  if not product_path.startswith(
                      category + "/"
                  ):
                      continue

                  current_products.add(
                      product_path
                  )

              old_current = set(
                  previous_products.get(
                      category,
                      []
                  )
              )

              ever_seen = set(
                  ever_seen_products.get(
                      category,
                      []
                  )
              )

              # Truly new products
              brand_new_products = (
                  current_products
                  - ever_seen
              )

              # Old products that disappeared
              # and have now returned
              returned_products = (
                  current_products
                  - old_current
              ) & ever_seen

              if not initialized:
                  print(
                      f"Baseline "
                      f"{category_name}: "
                      f"{len(current_products)} "
                      f"products"
                  )

              elif (
                  category
                  in brand_new_categories
              ):
                  # New category already generated
                  # its own alert.
                  # Don't spam another alert
                  # for every initial product.
                  print(
                      f"New category "
                      f"{category_name}: "
                      f"{len(current_products)} "
                      f"products recorded"
                  )

              else:
                  if brand_new_products:
                      send_discord(
                          "🆕 **CHROME HEARTS 上新了**\n"
                          f"分类：**{category_name}**\n"
                          f"新增商品："
                          f"**{len(brand_new_products)} 个**\n"
                          f"{category_url}"
                      )

                      print(
                          f"NEW PRODUCTS: "
                          f"{category_name} "
                          f"+{len(brand_new_products)}"
                      )

                  if returned_products:
                      send_discord(
                          "🔄 **CHROME HEARTS 商品重新上线**\n"
                          f"分类：**{category_name}**\n"
                          f"重新出现："
                          f"**{len(returned_products)} 个**\n"
                          f"{category_url}"
                      )

                      print(
                          f"PRODUCTS RETURNED: "
                          f"{category_name} "
                          f"+{len(returned_products)}"
                      )

              current_products_state[
                  category
              ] = sorted(
                  current_products
              )

              new_ever_seen_state[
                  category
              ] = sorted(
                  ever_seen
                  | current_products
              )

          # Categories that are currently offline
          # are explicitly stored as having zero
          # currently visible products.
          for category in known_categories:
              if (
                  category
                  not in current_categories
              ):
                  current_products_state[
                      category
                  ] = []

          # ------------------------
          # SAVE STATE
          # ------------------------

          cleaned_categories = (
              known_categories
              | current_categories
          )

          # Remove accidental old "cart" state
          cleaned_categories.discard(
              "/cart"
          )

          current_products_state.pop(
              "/cart",
              None
          )

          new_ever_seen_state.pop(
              "/cart",
              None
          )

          state = {
              "initialized": True,
              "known_categories": sorted(
                  cleaned_categories
              ),
              "online_categories": sorted(
                  current_categories
              ),
              "current_products_by_category":
                  current_products_state,
              "ever_seen_products_by_category":
                  new_ever_seen_state
          }

          with open(
              STATE_FILE,
              "w"
          ) as f:
              json.dump(
                  state,
                  f,
                  indent=2
              )

          PY

      - name: Save Chrome Hearts state
        run: |
          git config user.name "Chrome Hearts Monitor"
          git config user.email "actions@github.com"
          git add .chromehearts_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Chrome Hearts state"
            git push
          fi
