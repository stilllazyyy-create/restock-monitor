name: Chrome Hearts Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chromehearts.yml'
      - 'scripts/chromehearts.py'
      - 'tests/test_chromehearts.py'
  schedule:
    # Every 5 minutes, offset from the busiest exact-hour slots:
    # :02, :07, :12, :17, :22, ...
    - cron: "2-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

# Prevent two runs from changing the state file at the same time
concurrency:
  group: chrome-hearts-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test monitor logic
        run: python3 -m unittest discover -s tests -v

      - name: Check Chrome Hearts
        env:
          CHROME_HEARTS_WEBHOOK_URL: ${{ secrets.CHROME_HEARTS_WEBHOOK_URL }}

        run: python3 scripts/chromehearts.py

      - name: Save Chrome Hearts state
        if: ${{ always() }}

        run: |
          git config user.name "Chrome Hearts Monitor"
          git config user.email "actions@github.com"

          git add .chromehearts_state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update Chrome Hearts state"

          # Retry push in case the repository changed while this job ran
          for attempt in 1 2 3; do
            if git push; then
              echo "State pushed successfully."
              exit 0
            fi

            echo "Push failed. Retrying ($attempt/3)..."

            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done

          echo "ERROR: Could not push Chrome Hearts state."
          exit 1
