name: Scheduler diagnostic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-probe.yml'

permissions: {}

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record trigger and UTC time
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          echo "event=$TRIGGER_EVENT"
          echo "actor=$TRIGGER_ACTOR"
