name: Stussy Restock Monitor

on:
  schedule:
    # Every 5 minutes, offset by 2 minutes:
    # :02, :07, :12, :17, ...
    - cron: "2-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stussy-restock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Stussy stock and new arrivals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: |
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          STATE_FILE = ".restock_state.json"

          STORE_URL = "https://ca.stussy.com"

          NEW_ARRIVALS_URL = (
              "https://ca.stussy.com/collections/new-arrivals"
          )

          TARGETS = [
              {
                  "name": "Skulls Tee",
                  "url": (
                      "https://ca.stussy.com/products/"
                      "1905177-skulls-tee-faded-black"
                  ),
                  "variants": {
                      52765121773936: "Faded Black / S",
                  },
              },

              {
                  "name": "Always World Tour Tee Black",
                  "url": (
                      "https://ca.stussy.com/products/"
                      "3904050-stussy-always-world-tour-tee-black"
                  ),
                  "variants": {
                      54012844278128: "Black / S",
                      54012844310896: "Black / M",
                  },
              },

              {
                  "name": "Always World Tour Tee White",
                  "url": (
                      "https://ca.stussy.com/products/"
                      "3904050-stussy-always-world-tour-tee-white"
                  ),
                  "variants": {
                      54012851552624: "White / S",
                      54012851585392: "White / M",
                  },
              },

              {
                  "name": "Basic Stussy Thermal",
                  "url": (
                      "https://ca.stussy.com/products/"
                      "1140356-basic-stussy-thermal-washed-black"
                  ),
                  "variants": {
                      52349784162672: "Washed Black / S",
                      52349784195440: "Washed Black / M",
                      52349784228208: "Washed Black / L",
                  },
              },
          ]

          try:
              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  state = json.load(f)

          except (
              FileNotFoundError,
              json.JSONDecodeError
          ):
              state = {}

          webhook = os.environ.get(
              "DISCORD_WEBHOOK_URL"
          )

          if not webhook:
              raise RuntimeError(
                  "DISCORD_WEBHOOK_URL secret is missing"
              )

          def fetch_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                          "AppleWebKit/605.1.15 "
                          "(KHTML, like Gecko) "
                          "Version/18.0 Mobile/15E148 Safari/604.1"
                      ),
                      "Accept": (
                          "application/json,text/plain,*/*"
                      ),
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )

              with urllib.request.urlopen(
                  req,
                  timeout=25
              ) as response:
                  return json.load(response)

          def send_discord_payload(
              payload,
              max_retries=5
          ):
              data = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              for attempt in range(
                  max_retries
              ):
                  request = urllib.request.Request(
                      webhook,
                      data=data,
                      headers={
                          "Content-Type": (
                              "application/json"
                          ),
                          "User-Agent": (
                              "Stussy-Restock-Monitor/4.0"
                          ),
                      },
                      method="POST",
                  )

                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=25
                      ) as response:
                          response.read()

                      return True

                  except urllib.error.HTTPError as e:
                      if e.code == 429:
                          try:
                              body = (
                                  e.read()
                                  .decode("utf-8")
                              )

                              info = json.loads(
                                  body
                              )

                              retry_after = float(
                                  info.get(
                                      "retry_after",
                                      2
                                  )
                              )

                          except Exception:
                              retry_after = 2

                          print(
                              "Discord rate limit. "
                              f"Waiting {retry_after}s..."
                          )

                          time.sleep(
                              retry_after + 0.5
                          )

                          continue

                      print(
                          "Discord HTTP error: "
                          f"{e.code} {e.reason}"
                      )

                  except Exception as e:
                      print(
                          f"Discord error: {e}"
                      )

                  time.sleep(2)

              return False

          def send_text(text):
              return send_discord_payload(
                  {
                      "content": text
                  }
              )

          # ============================================================
          # RESTOCK MONITOR
          # ============================================================

          print("")
          print(
              "=========================================="
          )
          print("RESTOCK MONITOR")
          print(
              "=========================================="
          )

          for product_info in TARGETS:
              product_url = product_info[
                  "url"
              ]

              json_url = (
                  product_url
                  + ".js?v="
                  + str(int(time.time()))
              )

              try:
                  product = fetch_json(
                      json_url
                  )

              except Exception as e:
                  print(
                      "ERROR fetching "
                      f"{product_info['name']}: {e}"
                  )

                  continue

              variant_lookup = {
                  int(v["id"]): v
                  for v in product.get(
                      "variants",
                      []
                  )
              }

              for (
                  variant_id,
                  expected_title
              ) in product_info[
                  "variants"
              ].items():

                  variant = (
                      variant_lookup.get(
                          variant_id
                      )
                  )

                  if not variant:
                      print(
                          "ERROR: "
                          f"{product_info['name']} | "
                          f"{expected_title} | "
                          "variant not found"
                      )

                      continue

                  available = bool(
                      variant.get(
                          "available",
                          False
                      )
                  )

                  key = (
                      "variant_"
                      + str(variant_id)
                  )

                  previous = state.get(
                      key
                  )

                  print(
                      f"{product_info['name']} | "
                      f"{variant.get('title')} | "
                      f"ID={variant_id} | "
                      f"available={available} | "
                      f"previous={previous}"
                  )

                  # First time:
                  # baseline only.
                  if previous is None:
                      state[key] = available

                      print(
                          "Baseline created: "
                          f"{product_info['name']} | "
                          f"{variant.get('title')}"
                      )

                      continue

                  # Only FALSE -> TRUE
                  if (
                      available
                      and previous is False
                  ):
                      image = product.get(
                          "featured_image"
                      )

                      embed = {
                          "title": (
                              "🚨 STUSSY RESTOCK"
                          ),
                          "description": (
                              f"**{product_info['name']}**\n"
                              f"**{variant.get('title')}**\n\n"
                              "✅ **IN STOCK**\n"
                              "点击标题直接购买"
                          ),
                          "url": (
                              f"{product_url}"
                              f"?variant={variant_id}"
                          ),
                      }

                      if image:
                          if image.startswith(
                              "//"
                          ):
                              image = (
                                  "https:" + image
                              )

                          embed["image"] = {
                              "url": image
                          }

                      success = (
                          send_discord_payload(
                              {
                                  "content": (
                                      "🚨 **STUSSY 补货了！**"
                                  ),
                                  "embeds": [
                                      embed
                                  ],
                              }
                          )
                      )

                      if success:
                          print(
                              "RESTOCK NOTIFICATION SENT: "
                              f"{product_info['name']} | "
                              f"{variant.get('title')}"
                          )

                      else:
                          print(
                              "WARNING: "
                              "Restock Discord notification "
                              "could not be sent."
                          )

                  state[key] = available

          # ============================================================
          # NEW ARRIVALS MONITOR
          # ============================================================

          print("")
          print(
              "=========================================="
          )
          print("NEW ARRIVALS MONITOR")
          print(
              "=========================================="
          )

          try:
              new_arrivals_json = (
                  NEW_ARRIVALS_URL
                  + "/products.json?limit=250&v="
                  + str(int(time.time()))
              )

              arrivals_data = fetch_json(
                  new_arrivals_json
              )

              products = arrivals_data.get(
                  "products",
                  []
              )

              print(
                  "New Arrivals currently contains "
                  f"{len(products)} products"
              )

              current_ids = set()

              for product in products:
                  product_id = product.get(
                      "id"
                  )

                  if product_id is not None:
                      current_ids.add(
                          str(product_id)
                      )

              # Permanent history:
              # products that have EVER appeared.
              ever_seen = state.get(
                  "new_arrivals_ever_seen"
              )

              # First run after switching to this version.
              # Build history from current page + old saved IDs.
              # No Discord alert.
              if ever_seen is None:
                  old_ids = state.get(
                      "new_arrivals_products",
                      []
                  )

                  ever_seen_ids = {
                      str(x)
                      for x in old_ids
                  }

                  ever_seen_ids.update(
                      current_ids
                  )

                  print(
                      "New Arrivals permanent history "
                      "baseline created."
                  )

                  print(
                      "No New Arrivals alert sent "
                      "on this migration run."
                  )

              else:
                  ever_seen_ids = {
                      str(x)
                      for x in ever_seen
                  }

                  truly_new_ids = (
                      current_ids
                      - ever_seen_ids
                  )

                  print(
                      f"Current count: "
                      f"{len(current_ids)}"
                  )

                  print(
                      "Never-seen new products: "
                      f"{len(truly_new_ids)}"
                  )

                  if truly_new_ids:
                      success = send_text(
                          "🚨 **STUSSY NEW ARRIVALS**\n"
                          f"官网检测到 "
                          f"**{len(truly_new_ids)} 件新品**\n"
                          f"{NEW_ARRIVALS_URL}"
                      )

                      if success:
                          print(
                              "NEW ARRIVALS "
                              "NOTIFICATION SENT: "
                              f"{len(truly_new_ids)} "
                              "product(s)"
                          )

                      else:
                          print(
                              "WARNING: "
                              "New Arrivals Discord "
                              "notification failed."
                          )

                  else:
                      print(
                          "No genuinely new "
                          "arrivals detected."
                      )

                  ever_seen_ids.update(
                      current_ids
                  )

              # Save permanent history
              state[
                  "new_arrivals_ever_seen"
              ] = sorted(
                  ever_seen_ids
              )

              # Also save current page for reference
              state[
                  "new_arrivals_products"
              ] = sorted(
                  current_ids
              )

          except Exception as e:
              print(
                  "ERROR checking New Arrivals: "
                  f"{type(e).__name__}: {e}"
              )

          # ============================================================
          # SAVE STATE LOCALLY
          # ============================================================

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  state,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print(
              "State saved successfully."
          )

          PY

      - name: Save stock state
        run: |
          git config user.name "Restock Monitor"
          git config user.email "actions@github.com"

          git add .restock_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Stussy monitor state"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No state changes to commit."
          fi
