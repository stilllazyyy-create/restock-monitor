name: Stussy Restock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Stussy stock and new arrivals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          STATE_FILE = ".restock_state.json"
          NEW_ARRIVALS_URL = "https://ca.stussy.com/collections/new-arrivals"
          NEW_ARRIVALS_JSON = NEW_ARRIVALS_URL + "/products.json?limit=250"

          TARGETS = [
              {
                  "name": "Skulls Tee",
                  "url": "https://ca.stussy.com/products/1905177-skulls-tee-faded-black",
                  "variants": {
                      52765121773936: "Faded Black / S",
                  },
              },
              {
                  "name": "Always World Tour Tee Black",
                  "url": "https://ca.stussy.com/products/3904050-stussy-always-world-tour-tee-black",
                  "variants": {
                      54012844278128: "Black / S",
                      54012844310896: "Black / M",
                  },
              },
              {
                  "name": "Always World Tour Tee White",
                  "url": "https://ca.stussy.com/products/3904050-stussy-always-world-tour-tee-white",
                  "variants": {
                      54012851552624: "White / S",
                      54012851585392: "White / M",
                  },
              },
              {
                  "name": "Basic Stussy Thermal",
                  "url": "https://ca.stussy.com/products/1140356-basic-stussy-thermal-washed-black",
                  "variants": {
                      52349784162672: "Washed Black / S",
                      52349784195440: "Washed Black / M",
                      52349784228208: "Washed Black / L",
                  },
              },
          ]

          try:
              with open(STATE_FILE, "r") as f:
                  state = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}

          webhook = os.environ["DISCORD_WEBHOOK_URL"]

          def send_discord(text):
              data = json.dumps({"content": text}).encode()

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0"
                  },
                  method="POST"
              )

              urllib.request.urlopen(request, timeout=20)

          # ------------------------
          # RESTOCK MONITOR
          # ------------------------

          for product_info in TARGETS:
              product_url = product_info["url"]
              json_url = product_url + ".js"

              try:
                  req = urllib.request.Request(
                      json_url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=20) as r:
                      product = json.load(r)

              except Exception as e:
                  print(f"ERROR fetching {product_info['name']}: {e}")
                  continue

              variant_lookup = {
                  int(v["id"]): v
                  for v in product["variants"]
              }

              for variant_id, expected_title in product_info["variants"].items():
                  variant = variant_lookup.get(variant_id)

                  if not variant:
                      print(
                          f"ERROR: {product_info['name']} "
                          f"{expected_title} variant not found"
                      )
                      continue

                  available = variant["available"] is True
                  key = str(variant_id)
                  previous = state.get(key, False)

                  print(
                      f"{product_info['name']} | "
                      f"{variant['title']} | "
                      f"ID: {variant_id} | "
                      f"available: {available}"
                  )

                  if available and not previous:
                      send_discord(
                          "🚨 **STUSSY RESTOCK**\n"
                          f"**{product_info['name']}**\n"
                          f"**{variant['title']}**\n"
                          "✅ **IN STOCK**\n"
                          f"{product_url}?variant={variant_id}"
                      )

                      print(
                          f"Discord notification sent: "
                          f"{product_info['name']} {variant['title']}"
                      )

                  state[key] = available

          # ------------------------
          # NEW ARRIVALS MONITOR
          # ------------------------

          try:
              req = urllib.request.Request(
                  NEW_ARRIVALS_JSON,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=20) as r:
                  arrivals_data = json.load(r)

              current_ids = sorted(
                  str(product["id"])
                  for product in arrivals_data.get("products", [])
              )

              previous_ids = state.get("new_arrivals_products")

              if previous_ids is None:
                  # First run: establish baseline only
                  state["new_arrivals_products"] = current_ids
                  print(
                      f"New Arrivals baseline created: "
                      f"{len(current_ids)} products"
                  )

              else:
                  previous_set = set(previous_ids)
                  current_set = set(current_ids)

                  added = current_set - previous_set

                  if added:
                      send_discord(
                          "🚨 **STUSSY NEW ARRIVALS**\n"
                          "官网有新品上新了！\n"
                          f"{NEW_ARRIVALS_URL}"
                      )

                      print(
                          f"New Arrivals detected: "
                          f"{len(added)} new product(s)"
                      )
                  else:
                      print("No new arrivals detected")

                  state["new_arrivals_products"] = current_ids

          except Exception as e:
              print(f"ERROR checking New Arrivals: {e}")

          with open(STATE_FILE, "w") as f:
              json.dump(state, f, indent=2)

          PY

      - name: Save stock state
        run: |
          git config user.name "Restock Monitor"
          git config user.email "actions@github.com"
          git add .restock_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update restock state"
            git push
          fi
