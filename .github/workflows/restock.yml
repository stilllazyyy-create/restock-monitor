name: Stussy Variant Finder

on:
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Stussy variants
        run: |
          python3 <<'PY'
          import json
          import urllib.request

          PRODUCT_URL = "https://ca.stussy.com/products/1140356-basic-stussy-thermal-washed-black"
          JSON_URL = PRODUCT_URL + ".js"

          req = urllib.request.Request(
              JSON_URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              product = json.load(r)

          print("=== ALL VARIANTS ===")

          for v in product["variants"]:
              print(
                  f"title: {v['title']} | "
                  f"id: {v['id']} | "
                  f"available: {v['available']}"
              )

          PY
