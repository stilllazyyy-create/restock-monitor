name: Stussy Restock Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restock-continuous-v1
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Stussy stock and new arrivals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        run: python3 scripts/stussy.py

      - name: Save stock state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Restock Monitor"
          git config user.email "actions@github.com"

          git add .restock_state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update Stussy monitor state"

          for attempt in 1 2 3; do

            if git push; then
              echo "State pushed successfully."
              exit 0
            fi

            echo "Push failed. Syncing repository and retrying..."

            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "ERROR: git pull --rebase failed."
              git rebase --abort || true
              exit 1
            fi

            sleep 3

          done

          echo "ERROR: Could not push Stussy state."
          exit 1

