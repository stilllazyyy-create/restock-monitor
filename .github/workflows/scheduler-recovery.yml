name: Repair Chrome Hearts scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-recovery.yml'
      - 'scripts/recover_scheduler.py'

permissions:
  contents: read
  actions: write

concurrency:
  group: chrome-hearts-scheduler-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repair verified stale run and reset schedule registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover_scheduler.py
